[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --cov=core --cov=examples --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "A", "RUF", "S"]
ignore = ["S101", "S310", "RUF012", "UP042"]

[tool.ruff.lint.per-file-ignores]
"examples/*/run.py" = ["E402"]
"tests/*.py" = ["S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["core", "examples", "tests"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
